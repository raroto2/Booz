<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부지러너 · 기록 인증 현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --track-navy:#16233F;
    --track-navy-2:#24365C;
    --bib-orange:#FF6B35;
    --bib-orange-dark:#E5501C;
    --trail-green:#2D6A4F;
    --trail-green-light:#E7F4EC;
    --warn-red:#E63946;
    --warn-red-light:#FDEAEC;
    --medal-gold:#C99A2E;
    --medal-silver:#94A0AC;
    --medal-bronze:#B8703F;
    --paper:#F1F4EF;
    --card:#FFFFFF;
    --ink:#17202B;
    --muted:#707B85;
    --line:#E4E8E1;
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:9px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Noto Sans KR',-apple-system,sans-serif;
    background-color:var(--paper);
    background-image:repeating-linear-gradient(135deg, rgba(22,35,63,0.035) 0px, rgba(22,35,63,0.035) 2px, transparent 2px, transparent 34px);
    color:var(--ink);
    padding:18px;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'Space Mono',monospace;}
  .container{max-width:1120px;margin:0 auto;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--bib-orange);outline-offset:2px;}

  /* ===== Header : bib tag ===== */
  header.bib-header{
    background:var(--track-navy);
    background-image:linear-gradient(135deg, var(--track-navy) 0%, var(--track-navy-2) 100%);
    border-radius:var(--radius-lg);
    padding:20px 26px;
    margin-bottom:16px;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px;
    position:relative;
    box-shadow:0 8px 24px rgba(22,35,63,0.22);
  }
  header.bib-header::after{
    content:"";
    position:absolute; left:24px; right:24px; bottom:-1px; height:1px;
    background-image:radial-gradient(circle, rgba(255,255,255,0.18) 1.4px, transparent 1.4px);
    background-size:10px 1px;
  }
  .bib-id{display:flex; align-items:center; gap:14px;}
  .bib-num{
    font-family:'Black Han Sans',sans-serif;
    background:var(--bib-orange);
    color:#fff;
    font-size:0.85rem;
    letter-spacing:1px;
    padding:9px 12px;
    border-radius:10px;
    box-shadow:0 3px 0 var(--bib-orange-dark);
    transform:rotate(-3deg);
  }
  h1{
    font-family:'Black Han Sans',sans-serif;
    color:#fff;
    font-size:1.5rem;
    letter-spacing:0.5px;
  }
  .subtitle{color:#9FB0C8; font-size:0.82rem; margin-top:2px;}

  .month-nav{display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.08); padding:6px 8px 6px 16px; border-radius:14px; border:1px solid rgba(255,255,255,0.14);}
  .month-nav button{
    background:var(--bib-orange); color:#fff; border:none; border-radius:9px;
    width:30px; height:30px; font-weight:bold; cursor:pointer; font-size:1rem;
    display:flex; align-items:center; justify-content:center;
  }
  .month-nav button:hover{background:var(--bib-orange-dark);}
  .month-display{font-family:'Space Mono',monospace; font-size:1rem; font-weight:700; color:#fff; min-width:92px; text-align:center; letter-spacing:1px;}

  /* ===== Tabs : stopwatch selector ===== */
  .nav-tabs{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px;
    background:#fff; padding:6px; border-radius:16px; margin-bottom:18px; border:1px solid var(--line);
  }
  .tab-btn{
    background:transparent; border:none; padding:12px; border-radius:11px;
    font-weight:700; font-size:0.88rem; cursor:pointer; color:var(--muted);
    transition:background .15s, color .15s;
  }
  .tab-btn:hover{background:var(--paper);}
  .tab-btn.active{background:var(--track-navy); color:#fff; box-shadow:0 3px 10px rgba(22,35,63,0.25);}

  /* ===== Cards ===== */
  .card{background:var(--card); padding:22px; border-radius:var(--radius-lg); border:1px solid var(--line); box-shadow:0 1px 2px rgba(22,35,63,0.04); margin-bottom:18px;}
  .card h2{font-size:1.02rem; color:var(--ink); display:flex; align-items:center; gap:8px;}
  .grid-2{display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:18px;}

  /* ===== Ranking (dashboard left) ===== */
  .rank-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 14px; border-radius:12px; margin-bottom:7px; background:var(--paper);}
  .rank-row.gold{background:linear-gradient(90deg, #FFF6E4, var(--paper));}
  .rank-left{display:flex; align-items:center; gap:10px; min-width:0;}
  .rank-badge{
    width:28px; height:28px; border-radius:50%; background:var(--track-navy); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:0.8rem; font-weight:700; flex-shrink:0;
  }
  .rank-badge.r1{background:var(--medal-gold);}
  .rank-badge.r2{background:var(--medal-silver);}
  .rank-badge.r3{background:var(--medal-bronze);}
  .rank-name{font-weight:700; font-size:0.94rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rank-right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .rank-bar{width:64px; height:6px; border-radius:4px; background:#E4E8E1; overflow:hidden;}
  .rank-bar-fill{height:100%; background:var(--trail-green); border-radius:4px;}
  .rank-km{font-family:'Space Mono',monospace; font-weight:700; color:var(--trail-green); font-size:0.95rem; min-width:66px; text-align:right;}

  /* ===== Pace track bar ===== */
  .pace-track{position:relative; flex:1; height:14px; border-radius:7px; background:#EDEFEA; overflow:hidden; border:1px solid #E1E5DD;}
  .pace-track::before{
    content:""; position:absolute; inset:0;
    background-image:repeating-linear-gradient(90deg, transparent 0 9px, rgba(22,35,63,0.14) 9px 10px);
  }
  .pace-fill{position:absolute; left:0; top:0; bottom:0; border-radius:7px 0 0 7px; background:var(--warn-red); transition:width .3s;}
  .pace-fill.ok{background:var(--trail-green);}
  .pace-runner{position:absolute; top:50%; transform:translate(-50%,-50%); font-size:0.85rem;}

  .week-card{border:1px solid #F6D5D9; background:var(--warn-red-light); border-radius:var(--radius-md); padding:13px 14px; margin-bottom:12px;}
  .week-card.clear{border-color:var(--line); background:var(--trail-green-light);}
  .week-head{display:flex; justify-content:space-between; align-items:center; padding-bottom:8px; margin-bottom:9px; border-bottom:1px dashed rgba(0,0,0,0.1);}
  .week-head span:first-child{font-weight:800; font-size:0.9rem; color:#9F1239;}
  .week-card.clear .week-head span:first-child{color:var(--trail-green);}
  .week-count{font-size:0.72rem; font-weight:700; color:var(--warn-red); background:#fff; padding:3px 8px; border-radius:20px;}
  .week-card.clear .week-count{color:var(--trail-green);}
  .celebrate{color:var(--trail-green); font-size:0.85rem; font-weight:700;}
  .pace-row{display:flex; align-items:center; gap:10px; padding:6px 0;}
  .pace-name{font-weight:700; font-size:0.85rem; width:64px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pace-km{font-family:'Space Mono',monospace; font-size:0.78rem; font-weight:700; color:var(--warn-red); width:70px; text-align:right; flex-shrink:0;}

  /* ===== Tables ===== */
  table{width:100%; border-collapse:collapse; text-align:left;}
  th, td{padding:10px 8px; border-bottom:1px solid var(--line); font-size:0.88rem;}
  th{color:var(--muted); font-size:0.78rem; text-transform:uppercase; letter-spacing:0.4px; white-space:nowrap;}
  td.mono, th.mono{font-family:'Space Mono',monospace;}
  .under-cell{color:var(--warn-red); font-weight:700; position:relative; padding-left:14px;}
  .under-cell::before{content:""; position:absolute; left:0; top:50%; transform:translateY(-50%); width:6px; height:6px; border-radius:50%; background:var(--warn-red);}
  .month-total-cell{font-weight:800; color:var(--trail-green); background:var(--trail-green-light);}

  .stats-table-container{max-height:62vh; overflow:auto; border-radius:12px; border:1px solid var(--line);}
  .stats-table{border-collapse:separate; border-spacing:0; min-width:640px;}
  .stats-table th, .stats-table td{white-space:nowrap; padding:10px 12px;}
  .stats-table td:first-child{position:sticky; left:0; background:#fff; z-index:10; font-weight:700; min-width:100px; border-right:2px solid #cbd5c1;}
  .stats-table thead th{position:sticky; top:0; background:#fff; z-index:12;}
  .stats-table thead th:first-child{position:sticky; left:0; top:0; background:#fff; z-index:20; min-width:100px; border-right:2px solid #cbd5c1;}

  /* ===== Daily input sheet ===== */
  .table-scroll{max-height:62vh; overflow:auto;}
  .input-table-container{max-width:100%; border-radius:12px; border:1px solid var(--line);}
  .input-table{border-collapse:separate; border-spacing:0; min-width:920px;}
  .input-table th, .input-table td{border-right:1px solid var(--line); border-bottom:1px solid var(--line); text-align:center; padding:7px 4px; white-space:nowrap;}
  .input-table td:first-child{position:sticky; left:0; background:#fff; z-index:10; font-weight:700; border-right:2px solid #cbd5c1; width:88px; min-width:88px;}
  .input-table thead th{position:sticky; top:0; background:#fff; z-index:12;}
  .input-table thead th:first-child{position:sticky; left:0; top:0; background:#fff; z-index:20; width:88px; min-width:88px; border-right:2px solid #cbd5c1;}
  .day-header{font-size:0.7rem; display:block; font-weight:400; color:var(--muted);}
  .header-mon{background-color:#EDF4EF !important; color:var(--trail-green) !important; font-weight:800;}
  .header-sun{background-color:#FFF0E8 !important; color:var(--bib-orange-dark) !important; font-weight:800;}
  .day-input{
    width:44px; text-align:center; padding:6px 2px; border:1px solid #cbd5c1; border-radius:8px;
    font-size:0.83rem; font-weight:700; font-family:'Space Mono',monospace; outline:none; -moz-appearance:textfield;
  }
  .day-input::-webkit-outer-spin-button, .day-input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  .day-input:focus{border-color:var(--bib-orange); background:#FFF4EE; box-shadow:0 0 0 2px rgba(255,107,53,0.18);}

  /* ===== Members ===== */
  .member-row{display:flex; align-items:center; justify-content:space-between; padding:10px 12px; background:var(--paper); border-radius:12px; margin-bottom:7px;}
  .member-left{display:flex; align-items:center; gap:10px;}
  .avatar{width:32px; height:32px; border-radius:50%; background:var(--track-navy); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.85rem; flex-shrink:0;}
  .btn-danger{background:var(--warn-red-light); color:#9f1239; border:none; padding:7px 13px; border-radius:9px; font-weight:700; cursor:pointer; font-size:0.82rem;}
  .btn-danger:hover{background:#fbd0d5;}
  #memberForm input{flex:1; padding:11px 12px; border-radius:11px; border:1px solid var(--line); font-size:0.9rem;}
  #memberForm input:focus{border-color:var(--bib-orange);}
  #memberForm button{background:var(--bib-orange); color:#fff; font-weight:700; border:none; padding:11px 18px; border-radius:11px; cursor:pointer; box-shadow:0 3px 0 var(--bib-orange-dark);}
  #memberForm button:hover{background:var(--bib-orange-dark);}

  .hidden{display:none;}
  .hint{font-size:0.78rem; color:var(--muted); margin-bottom:12px;}
</style>
</head>
<body>
  <div class="container">
    <header class="bib-header">
      <div class="bib-id">
        <span class="bib-num">RUN</span>
        <div>
          <h1>부지러너</h1>
          <div class="subtitle">기록 인증 현황판 · 모임원 운동량 관리 · <span id="syncStatus">🔄 연결 중...</span></div>
        </div>
      </div>
      <div class="month-nav">
        <button onclick="changeMonth(-1)">‹</button>
        <div id="monthDisplay" class="month-display">2026.09</div>
        <button onclick="changeMonth(1)">›</button>
      </div>
    </header>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('dashboard')">📊 대시보드</button>
      <button class="tab-btn" onclick="switchTab('stats')">📈 월별 통계</button>
      <button class="tab-btn" onclick="switchTab('input')">✍️ 일별 직접 입력</button>
      <button class="tab-btn" onclick="switchTab('members')">👥 회원 관리</button>
    </div>

    <!-- 대시보드 -->
    <div id="tab-dashboard" class="tab-content grid-2">
      <div class="card">
        <h2>🏆 이달의 순위 <span style="font-size:0.7rem; color:var(--muted); font-weight:500;">TOP 5</span></h2>
        <div id="rankingList" style="margin-top:14px;"></div>
      </div>
      <div class="card">
        <h2 style="color:#9F1239;">🚧 주 25km 미달자</h2>
        <div id="redCardList" style="margin-top:14px;"></div>
      </div>
    </div>

    <!-- 월별 통계 -->
    <div id="tab-stats" class="tab-content card hidden">
      <h2>📈 개인별 주차별 / 월별 누계</h2>
      <p class="hint" style="margin-top:6px;">* 주차 합산은 월~일 7일 기준이며, 월 경계에 걸친 주는 목요일이 속한 월로 계산됩니다. 월 누계는 해당 월 1일~말일 실합산입니다.</p>
      <div class="stats-table-container">
        <table class="stats-table">
          <thead><tr id="statsHeader"></tr></thead>
          <tbody id="statsTableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 일별 직접 입력 -->
    <div id="tab-input" class="tab-content card hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:6px;">
        <h2>✍️ 일별 운동량 직접 입력</h2>
        <span class="hint" style="margin:0;">숫자를 입력하면 자동 저장됩니다 (단위: km)</span>
      </div>
      <div class="input-table-container table-scroll">
        <table class="input-table">
          <thead><tr id="inputTableHeader"></tr></thead>
          <tbody id="inputTableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 회원 관리 -->
    <div id="tab-members" class="tab-content card hidden" style="max-width:480px; margin:0 auto;">
      <h2 style="margin-bottom:15px;">👥 회원 관리</h2>
      <form id="memberForm" style="display:flex; gap:10px; margin-bottom:16px;">
        <input type="text" id="newMemberName" placeholder="신규 회원 이름" required />
        <button type="submit">추가</button>
      </form>
      <div id="memberList"></div>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    // ===== Firebase 초기화 =====
    const firebaseConfig = {
      apiKey: "AIzaSyCRjVXET7Yap-cYLkqXBD05I7_YT800mQE",
      authDomain: "booz-8aa43.firebaseapp.com",
      projectId: "booz-8aa43",
      storageBucket: "booz-8aa43.firebasestorage.app",
      messagingSenderId: "898161356173",
      appId: "1:898161356173:web:80b5190cc785928ceaa1c4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const membersDocRef = db.collection('buji_shared').doc('members');
    const recordsDocRef = db.collection('buji_shared').doc('records');

    function setSyncStatus(state) {
      const el = document.getElementById('syncStatus');
      if (!el) return;
      if (state === 'connecting') el.innerHTML = '🔄 연결 중...';
      else if (state === 'synced') el.innerHTML = '🟢 실시간 동기화 중';
      else el.innerHTML = '🔴 연결 오류 (Firestore 규칙 확인)';
    }

    const now = new Date();
    let currentYear = now.getFullYear();
    let currentMonth = now.getMonth() + 1;
    const WEEKLY_GOAL = 25;

    let members = [];
    let recordsMap = {};

    // ===== Firestore 저장 =====
    function saveMembers() {
      membersDocRef.set({ list: members }).catch(err => {
        console.error(err);
        setSyncStatus('error');
        alert('회원 정보 저장에 실패했습니다. Firestore 보안 규칙을 확인해주세요.');
      });
    }
    function saveRecords() {
      recordsDocRef.set({ map: recordsMap }).catch(err => {
        console.error(err);
        setSyncStatus('error');
        alert('기록 저장에 실패했습니다. Firestore 보안 규칙을 확인해주세요.');
      });
    }

    // ===== Firestore 실시간 구독 (안전 구문으로 수정됨) =====
    let membersReady = false, recordsReady = false;
    function checkBothReady() {
      if (membersReady && recordsReady) {
        setSyncStatus('synced');
        render();
      }
    }

    setSyncStatus('connecting');
    renderLoading();

    // 회원 목록 구독 (더 이상 홍길동으로 강제 초기화하지 않음)
    membersDocRef.onSnapshot(snap => {
      if (snap.exists && Array.isArray(snap.data().list)) {
        members = snap.data().list;
      } else {
        members = [];
      }
      membersReady = true;
      checkBothReady();
    }, err => { console.error(err); setSyncStatus('error'); });

    // 운동 기록 구독
    recordsDocRef.onSnapshot(snap => {
      if (snap.exists && snap.data().map) {
        recordsMap = snap.data().map;
      } else {
        recordsMap = {};
      }
      recordsReady = true;
      checkBothReady();
    }, err => { console.error(err); setSyncStatus('error'); });

    function changeMonth(delta) {
      currentMonth += delta;
      if (currentMonth < 1) { currentMonth = 12; currentYear -= 1; }
      else if (currentMonth > 12) { currentMonth = 1; currentYear += 1; }
      render();
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.remove('hidden');
      event.target.classList.add('active');
    }

    function formatDate(y, m, d) {
      const mm = String(m).padStart(2, '0');
      const dd = String(d).padStart(2, '0');
      return `${y}-${mm}-${dd}`;
    }

    function onDistanceChange(dateStr, memberId, value) {
      const numVal = parseFloat(value);
      if (!recordsMap[dateStr]) recordsMap[dateStr] = {};
      if (!isNaN(numVal) && numVal > 0) {
        recordsMap[dateStr][memberId] = numVal;
      } else {
        delete recordsMap[dateStr][memberId];
        if (Object.keys(recordsMap[dateStr]).length === 0) delete recordsMap[dateStr];
      }
      render();
      saveRecords();
    }

    function getWeeksOfMonth(year, month) {
      const weeks = [];
      let firstDay = new Date(year, month - 1, 1);
      let dayOfWeek = firstDay.getDay();
      let diffToMon = (dayOfWeek === 0 ? -6 : 1 - dayOfWeek);
      let currentMon = new Date(year, month - 1, 1 + diffToMon);

      let weekIdx = 1;
      while (true) {
        let currentSun = new Date(currentMon);
        currentSun.setDate(currentMon.getDate() + 6);

        let thursday = new Date(currentMon);
        thursday.setDate(currentMon.getDate() + 3);

        if (thursday.getMonth() + 1 === month && thursday.getFullYear() === year) {
          weeks.push({ weekNum: weekIdx, startDate: new Date(currentMon), endDate: new Date(currentSun) });
          weekIdx++;
        }

        currentMon.setDate(currentMon.getDate() + 7);
        if (currentMon.getMonth() + 1 > month && thursday.getMonth() + 1 === month) break;
        if (currentMon.getFullYear() > year) break;
        if (weekIdx > 6) break;
      }
      return weeks;
    }

    function paceTrackHTML(distance, goal, mini) {
      const pct = Math.min(100, (distance / goal) * 100);
      const ok = distance >= goal;
      const trackClass = mini ? 'pace-track' : 'pace-track';
      return `
        <div class="${trackClass}" style="${mini ? 'height:6px;' : ''}">
          <div class="pace-fill ${ok ? 'ok' : ''}" style="width:${pct}%;"></div>
          ${!mini ? `<span class="pace-runner" style="left:${pct}%;">🏃</span>` : ''}
        </div>
      `;
    }

    function renderLoading() {
      const loadingMsg = '<p class="hint">데이터를 불러오는 중입니다...</p>';
      document.getElementById('rankingList').innerHTML = loadingMsg;
      document.getElementById('redCardList').innerHTML = loadingMsg;
      document.getElementById('memberList').innerHTML = loadingMsg;
      document.getElementById('statsTableBody').innerHTML = '';
      document.getElementById('inputTableBody').innerHTML = '';
    }

    function render() {
      document.getElementById('monthDisplay').innerText = `${currentYear}.${String(currentMonth).padStart(2,'0')}`;
      const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
      const weekDaysKorean = ['일', '월', '화', '수', '목', '금', '토'];

      // [1] 일별 직접 입력 테이블
      let headerHTML = '<th>이름</th>';
      for (let d = 1; d <= daysInMonth; d++) {
        const date = new Date(currentYear, currentMonth - 1, d);
        const dayOfWeek = date.getDay();
        let colorClass = (dayOfWeek === 1) ? 'header-mon' : (dayOfWeek === 0 ? 'header-sun' : '');
        headerHTML += `<th class="${colorClass}">${d}일<span class="day-header">(${weekDaysKorean[dayOfWeek]})</span></th>`;
      }
      document.getElementById('inputTableHeader').innerHTML = headerHTML;

      let bodyHTML = '';
      members.forEach(m => {
        bodyHTML += `<tr><td>${m.name}</td>`;
        for (let d = 1; d <= daysInMonth; d++) {
          const dateStr = formatDate(currentYear, currentMonth, d);
          const val = (recordsMap[dateStr] && recordsMap[dateStr][m.id]) ? recordsMap[dateStr][m.id] : '';
          bodyHTML += `<td><input type="number" step="0.1" class="day-input" value="${val}" onchange="onDistanceChange('${dateStr}', ${m.id}, this.value)" /></td>`;
        }
        bodyHTML += `</tr>`;
      });
      document.getElementById('inputTableBody').innerHTML = bodyHTML;

      // [2] 주차 데이터 계산
      const currentWeeks = getWeeksOfMonth(currentYear, currentMonth);

      const stats = members.map(m => {
        const weeklyTotals = {};
        currentWeeks.forEach(w => {
          let wSum = 0;
          let cur = new Date(w.startDate);
          while (cur <= w.endDate) {
            const dateStr = formatDate(cur.getFullYear(), cur.getMonth() + 1, cur.getDate());
            if (recordsMap[dateStr] && recordsMap[dateStr][m.id]) wSum += recordsMap[dateStr][m.id];
            cur.setDate(cur.getDate() + 1);
          }
          weeklyTotals[w.weekNum] = wSum;
        });

        let monthTotal = 0;
        for (let d = 1; d <= daysInMonth; d++) {
          const dateStr = formatDate(currentYear, currentMonth, d);
          if (recordsMap[dateStr] && recordsMap[dateStr][m.id]) monthTotal += recordsMap[dateStr][m.id];
        }
        return { ...m, weeklyTotals, monthTotal };
      });

      // [3] 대시보드 - 순위
      const sortedRank = [...stats].sort((a, b) => b.monthTotal - a.monthTotal);
      const topTotal = sortedRank.length ? Math.max(...sortedRank.map(m => m.monthTotal), 1) : 1;
      const top5 = sortedRank.slice(0, 5);
      const rankClass = i => i === 0 ? 'r1' : i === 1 ? 'r2' : i === 2 ? 'r3' : '';
      document.getElementById('rankingList').innerHTML = top5.map((m, i) => `
        <div class="rank-row ${i === 0 ? 'gold' : ''}">
          <div class="rank-left">
            <span class="rank-badge ${rankClass(i)}">${i + 1}</span>
            <span class="rank-name">${m.name}</span>
          </div>
          <div class="rank-right">
            <div class="rank-bar"><div class="rank-bar-fill" style="width:${(m.monthTotal / topTotal) * 100}%;"></div></div>
            <span class="rank-km">${m.monthTotal.toFixed(1)} km</span>
          </div>
        </div>
      `).join('') || `<p class="hint">등록된 회원이 없습니다.</p>`;

      // [4] 대시보드 - 경고
      const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const startedWeeks = currentWeeks.filter(w => w.startDate <= todayMidnight);

      let redCardHTML = '';
      startedWeeks.forEach(w => {
        const underMembers = stats.filter(m => (m.weeklyTotals[w.weekNum] || 0) < WEEKLY_GOAL);
        const startStr = `${w.startDate.getMonth()+1}/${w.startDate.getDate()}`;
        const endStr = `${w.endDate.getMonth()+1}/${w.endDate.getDate()}`;
        const clear = underMembers.length === 0;

        redCardHTML += `
          <div class="week-card ${clear ? 'clear' : ''}">
            <div class="week-head">
              <span>📌 ${w.weekNum}주차 (${startStr}~${endStr})</span>
              <span class="week-count">${clear ? '전원 달성' : underMembers.length + '명 미달'}</span>
            </div>
        `;
        if (clear) {
          redCardHTML += `<div class="celebrate">🎉 전원 목표 페이스 달성!</div>`;
        } else {
          underMembers.forEach(m => {
            const dist = m.weeklyTotals[w.weekNum] || 0;
            redCardHTML += `
              <div class="pace-row">
                <span class="pace-name">${m.name}</span>
                ${paceTrackHTML(dist, WEEKLY_GOAL, false)}
                <span class="pace-km">${dist.toFixed(1)}/${WEEKLY_GOAL}</span>
              </div>
            `;
          });
        }
        redCardHTML += `</div>`;
      });
      document.getElementById('redCardList').innerHTML = redCardHTML || `<p class="hint">이번 달 주차 데이터가 없습니다.</p>`;

      // [5] 월별 통계
      let statsHeaderHTML = '<th>이름</th>';
      currentWeeks.forEach(w => { statsHeaderHTML += `<th class="mono">${w.weekNum}주차</th>`; });
      statsHeaderHTML += `<th class="mono" style="color:var(--trail-green);">월 누계</th>`;
      document.getElementById('statsHeader').innerHTML = statsHeaderHTML;

      document.getElementById('statsTableBody').innerHTML = stats.map(m => `
        <tr>
          <td style="font-weight:700;">${m.name}</td>
          ${currentWeeks.map(w => {
            const dist = m.weeklyTotals[w.weekNum] || 0;
            const under = dist < WEEKLY_GOAL;
            return `<td class="mono ${under ? 'under-cell' : ''}">${dist.toFixed(1)}km</td>`;
          }).join('')}
          <td class="mono month-total-cell">${m.monthTotal.toFixed(1)} km</td>
        </tr>
      `).join('');

      // [6] 회원 관리
      document.getElementById('memberList').innerHTML = members.map(m => `
        <div class="member-row">
          <div class="member-left">
            <span class="avatar">${m.name.charAt(0)}</span>
            <span style="font-weight:700;">${m.name}</span>
          </div>
          <button class="btn-danger" onclick="deleteMember(${m.id})">삭제</button>
        </div>
      `).join('') || `<p class="hint">등록된 회원이 없습니다.</p>`;
    }

    document.getElementById('memberForm').onsubmit = function(e) {
      e.preventDefault();
      const input = document.getElementById('newMemberName');
      if (!input.value.trim()) return;
      members.push({ id: Date.now(), name: input.value.trim() });
      input.value = '';
      render();
      saveMembers();
    };

    function deleteMember(id) {
      if (confirm('정말 삭제하시겠습니까?')) {
        members = members.filter(m => m.id !== id);
        render();
        saveMembers();
      }
    }
  </script>
</body>
</html>
